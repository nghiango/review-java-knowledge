name: Safe Zero-Downtime Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Run non-destructive additive migrations (Expand phase)
      # Compatible with BOTH currently running v1 code and incoming v2 code
      - name: Run Additive Database Migrations
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASS: ${{ secrets.PROD_DB_PASS }}
        run: |
          ./gradlew flywayMigrate \
            -Dflyway.url="${DB_URL}" \
            -Dflyway.user="${DB_USER}" \
            -Dflyway.password="${DB_PASS}"

      # Step 2: Deploy new application version (Transition phase)
      - name: Deploy New Application Version
        run: |
          aws ecs update-service \
            --cluster production-cluster \
            --service customer-service \
            --force-new-deployment

      # Step 3: Wait for service stability before declaring success
      - name: Verify Deployment Health
        run: |
          aws ecs wait services-stable \
            --cluster production-cluster \
            --services customer-service
