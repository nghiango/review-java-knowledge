AWSTemplateFormatVersion: '2010-09-09'
Description: E-Commerce Order Lifecycle SNS to SQS Fanout Architecture - Corrected

Resources:
  OrderEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: order-events-topic

  FraudDetectionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: fraud-detection-queue

  WarehouseShippingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: warehouse-shipping-queue

  CustomerNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: customer-notification-queue

  FraudDetectionSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Endpoint: !GetAtt FraudDetectionQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      FilterPolicyScope: MessageAttributes
      # Only receive payment completed events with amounts >= 500
      FilterPolicy:
        eventType:
          - PaymentCompleted
        amount:
          - numeric:
              - '>='
              - 500

  WarehouseShippingSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Endpoint: !GetAtt WarehouseShippingQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      FilterPolicyScope: MessageAttributes
      # Only receive events required for warehouse dispatch
      FilterPolicy:
        eventType:
          - PaymentCompleted
          - ShipmentDispatched

  CustomerNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Endpoint: !GetAtt CustomerNotificationQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      FilterPolicyScope: MessageAttributes
      # Only receive customer-facing milestone events
      FilterPolicy:
        eventType:
          - OrderCreated
          - ShipmentDispatched
          - OrderCancelled
