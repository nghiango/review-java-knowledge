AWSTemplateFormatVersion: '2010-09-09'
Description: Video Rendering SQS Queue and Processing Lambda - Corrected

Resources:
  VideoRenderDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: video-render-dlq
      MessageRetentionPeriod: 1209600 # 14 days retention for dead letters

  VideoRenderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: video-render-queue
      # Visibility timeout set to 6x Lambda timeout (6 * 90s = 540s) per AWS best practice
      VisibilityTimeout: 540
      MessageRetentionPeriod: 86400
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VideoRenderDeadLetterQueue.Arn
        maxReceiveCount: 3

  VideoRenderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: video-render-processor
      Runtime: java21
      Handler: lab.awsmessaging.RenderHandler::handleRequest
      Timeout: 90
      MemorySize: 2048
      Code:
        S3Bucket: deploy-artifacts
        S3Key: video-render-processor.jar

  VideoRenderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt VideoRenderQueue.Arn
      FunctionName: !GetAtt VideoRenderFunction.Arn
      # Constrained batch size to 1 for long-running compute jobs to prevent batch timeouts
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true
