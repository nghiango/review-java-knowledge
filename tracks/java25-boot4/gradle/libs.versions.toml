[versions]
spring-boot = "4.0.0-M1"
spring-framework = "7.0.0-M1"
jakarta-annotation = "3.0.0"
jakarta-validation = "3.1.0"
jspecify = "1.0.0"
junit = "5.14.4"
junit-platform = "1.14.4"
assertj = "3.27.7"
spotless = "8.10.2"
testcontainers = "1.20.6"
awaitility = "4.2.2"
archunit = "1.4.0"
postgresql = "42.7.5"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spring-context = { module = "org.springframework:spring-context", version = "6.2.4" }
spring-tx = { module = "org.springframework:spring-tx", version = "6.2.4" }
spring-web = { module = "org.springframework:spring-web", version = "6.2.4" }
spring-webmvc = { module = "org.springframework:spring-webmvc", version = "6.2.4" }
spring-test = { module = "org.springframework:spring-test", version = "6.2.4" }
spring-security-core = { module = "org.springframework.security:spring-security-core", version = "6.4.3" }
spring-security-web = { module = "org.springframework.security:spring-security-web", version = "6.4.3" }
spring-security-config = { module = "org.springframework.security:spring-security-config", version = "6.4.3" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto", version = "6.4.3" }
spring-security-test = { module = "org.springframework.security:spring-security-test", version = "6.4.3" }
spring-boot = { module = "org.springframework.boot:spring-boot", version = "3.4.3" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version = "3.4.3" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version = "3.4.3" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version = "6.0.0" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version = "8.0.2.Final" }
jakarta-el = { module = "org.glassfish:jakarta.el", version = "4.0.2" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version = "2.18.3" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.15.2" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version = "5.15.2" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.5.17" }
json-path = { module = "com.jayway.jsonpath:json-path", version = "2.9.0" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
