[versions]
spring-boot = "4.0.0-M1"
spring-framework = "7.0.0-M1"
jakarta-annotation = "3.0.0"
jakarta-validation = "3.1.0"
jspecify = "1.0.0"
junit = "5.14.4"
junit-platform = "1.14.4"
assertj = "3.27.7"
spotless = "8.10.2"
testcontainers = "1.20.6"
awaitility = "4.2.2"
archunit = "1.4.0"
postgresql = "42.7.5"

[libraries]
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spring-context = { module = "org.springframework:spring-context", version = "6.2.4" }
spring-tx = { module = "org.springframework:spring-tx", version = "6.2.4" }
spring-boot = { module = "org.springframework.boot:spring-boot", version = "3.4.3" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version = "3.4.3" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version = "3.4.3" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.5.17" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
