site_name: Senior Java / Spring Interview Lab
site_description: Senior backend interview preparation and production engineering laboratory
docs_dir: docs
strict: true

validation:
  links:
    absolute_links: relative_to_docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.share
    - search.suggest

nav:
  - Start:
      - Home: index.md
      - Roadmap: roadmap.md
      - Interview Checklist: interview-checklist.md
      - Progress: progress.md
      - Repository Architecture: architecture.md
  - Topics:
      - Core Java:
          - Overview: topics/core-java/index.md
          - Concepts: topics/core-java/concepts.md
          - Internals: topics/core-java/internals.md
          - Interview Questions: topics/core-java/questions.md
          - Code Review: topics/core-java/code-review.md
          - Solutions: topics/core-java/solutions.md
          - Tests: topics/core-java/tests.md
          - Production: topics/core-java/production.md
          - Exercises: topics/core-java/exercises.md
      - JVM:
          - Overview: topics/jvm/index.md
          - Concepts: topics/jvm/concepts.md
          - Internals: topics/jvm/internals.md
          - Interview Questions: topics/jvm/questions.md
          - Code Review: topics/jvm/code-review.md
          - Solutions: topics/jvm/solutions.md
          - Tests: topics/jvm/tests.md
          - Production: topics/jvm/production.md
          - Exercises: topics/jvm/exercises.md
      - Concurrency:
          - Overview: topics/concurrency/index.md
          - Concepts: topics/concurrency/concepts.md
          - Internals: topics/concurrency/internals.md
          - Interview Questions: topics/concurrency/questions.md
          - Code Review: topics/concurrency/code-review.md
          - Solutions: topics/concurrency/solutions.md
          - Tests: topics/concurrency/tests.md
          - Production: topics/concurrency/production.md
          - Exercises: topics/concurrency/exercises.md
      - Spring Core:
          - Overview: topics/spring-core/index.md
          - Concepts: topics/spring-core/concepts.md
          - Internals: topics/spring-core/internals.md
          - Interview Questions: topics/spring-core/questions.md
          - Code Review: topics/spring-core/code-review.md
          - Solutions: topics/spring-core/solutions.md
          - Tests: topics/spring-core/tests.md
          - Production: topics/spring-core/production.md
          - Exercises: topics/spring-core/exercises.md
  - Issues:
      - Catalogue: issues/index.md
      - Security: issues/security.md
      - Performance: issues/performance.md
      - Concurrency: issues/concurrency.md
      - Transactions: issues/transaction.md
      - Data Consistency: issues/data-consistency.md
      - Database and JPA: issues/database.md
      - Messaging: issues/messaging.md
      - Resilience: issues/resilience.md
      - Reliability: issues/reliability.md
      - Observability: issues/observability.md
      - Maintainability and Design: issues/maintainability.md
  - Scenarios:
      - Overview: scenarios/index.md
  - Questions:
      - Overview: questions/index.md
      - Java: questions/java.md
      - JVM: questions/jvm.md
      - Concurrency: questions/concurrency.md
      - Spring Core: questions/spring-core.md
  - Reference:
      - Overview: reference/index.md
  - Contributing:
      - Specification Index: spec/README.md
      - Module Conventions: spec/module-conventions.md
      - Issue Format: spec/issue-format.md
      - Curriculum: spec/curriculum.md
      - Documentation Conventions: spec/documentation-conventions.md
      - Version and Language Tracks: spec/tracks.md
      - Bootstrap Design: superpowers/specs/2026-09-18-bootstrap-core-java-design.md
      - Bootstrap Plan: superpowers/plans/2026-09-18-bootstrap-core-java.md
      - JVM Design: superpowers/specs/2026-09-18-jvm-module-design.md
      - JVM Plan: superpowers/plans/2026-09-18-jvm-module.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
